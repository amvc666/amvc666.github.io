<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护公告－艾梦云兮团队官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
        }

        :root {
            --primary-color: #00f0ff;
            --secondary-color: #7000ff;
            --bg-color: #0a0a12;
            --text-color: #e0e0ff;
            --card-bg: rgba(20, 20, 35, 0.7);
            --border-color: rgba(0, 240, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 背景动画效果 */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(0, 240, 255, 0.1) 0%, transparent 40%);
            animation: gradientRotate 20s linear infinite;
            opacity: 0.6;
        }

        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.5;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: var(--primary-color);
            border-radius: 50%;
            opacity: 0.5;
            animation: float 15s infinite ease-in-out;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 800px;
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        /* 头部标题 */
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            position: relative;
            display: inline-block;
            padding: 0 20px;
        }

        h1::before, h1::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), transparent);
            transform: translateY(-50%);
        }

        h1::before {
            left: -40px;
        }

        h1::after {
            right: -40px;
            background: linear-gradient(90deg, transparent, var(--secondary-color));
        }

        /* 内容卡片 */
        .content-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(0, 240, 255, 0.1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.8s ease-out 0.3s both;
        }

        .content-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 10px var(--primary-color);
            animation: scanline 3s linear infinite;
        }

        .announcement-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: justify;
            color: rgba(224, 224, 255, 0.9);
        }

        .signature {
            text-align: right;
            font-weight: 500;
            margin-top: 15px;
            color: var(--primary-color);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* 按钮区域 */
        .button-container {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        .tech-button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--bg-color);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(112, 0, 255, 0.4);
            text-decoration: none;
        }

        .tech-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.6);
            letter-spacing: 2px;
        }

        .tech-button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(0, 240, 255, 0.4);
        }

        .tech-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .tech-button:hover::before {
            left: 100%;
        }

        /* 页脚 */
        footer {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(224, 224, 255, 0.6);
            padding-top: 20px;
            border-top: 1px solid rgba(0, 240, 255, 0.1);
            animation: fadeIn 1s ease-out 0.9s both;
        }

        /* 动画定义 */
        @keyframes gradientRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-20px) translateX(10px); opacity: 0.7; }
            50% { transform: translateY(10px) translateX(-10px); opacity: 0.5; }
            75% { transform: translateY(-15px) translateX(5px); opacity: 0.8; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
                padding: 0 10px;
            }

            h1::before, h1::after {
                width: 20px;
            }

            h1::before { left: -20px; }
            h1::after { right: -20px; }

            .content-card {
                padding: 20px;
            }

            .announcement-text {
                font-size: 1rem;
            }

            .tech-button {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .content-card {
                padding: 15px;
            }

            .signature {
                text-align: center;
                margin-top: 15px;
            }

            .tech-button {
                width: 100%;
                padding: 15px;
            }
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .loading-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--primary-color);
            animation: pulse 2s infinite;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-text">系统初始化中...</div>
    </div>

    <!-- 背景动画 -->
    <div class="background-animation">
        <div class="bg-gradient"></div>
        <div class="grid-overlay"></div>
        <div class="particles" id="particles"></div>
    </div>

    <!-- 主内容容器 -->
    <div class="container">
        <header>
            <h1>网站维护公告</h1>
        </header>

        <main>
            <div class="content-card">
                <p class="announcement-text">
                    尊敬的用户：<br><br>
                    因服务器数据迁移与网站重构升级，本站（www.amvc.top）将暂停服务。升级后本站数据将从香港服务器迁移至阿里云深圳服务器，本站数据迁移至内地服务器后将依据大陆法律法规进行ICP备案与公安网备案工作，待备案完成后将重新开放访问。预计2026年2月恢复服务。为您带来的不便请谅解！如有疑问请邮件联系本团队理事处：bgs@xin.amvc.top；负责人：fang@xin.amvc.top
                </p>
                <div class="signature">艾梦云兮团队</div>
            </div>

            <div class="button-container">
                <a href="http://oa.amvc.top" class="tech-button" target="_blank" id="oaButton">
                    点击进入OA系统
                </a>
            </div>
        </main>

        <footer>
            <p>© 2017-2025 艾梦云兮团队 版权所有</p>
            <p>本页面临时托管于Github Page</p>
        </footer>
    </div>

    <script>
        // 页面加载完成后隐藏加载动画
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 800);
        });

        // 创建动态粒子背景
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 15 : 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 随机位置
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                
                // 随机动画延迟和持续时间
                const delay = Math.random() * 5;
                const duration = 10 + Math.random() * 10;
                
                particle.style.left = `${left}%`;
                particle.style.top = `${top}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                // 随机大小和颜色
                const size = Math.random() * 3 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // 随机颜色变体
                const colors = ['#00f0ff', '#7000ff', '#00ffaa', '#ff00aa'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                particlesContainer.appendChild(particle);
            }
        }

        // 按钮点击事件处理
        document.getElementById('oaButton').addEventListener('click', function(e) {
            // 可以在这里添加点击后的反馈效果
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
            }, 150);
            
            // 实际跳转已经在href中实现，这里可以添加额外的分析或反馈
            console.log('跳转到OA系统');
        });

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            // 添加键盘导航支持
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && document.activeElement === document.getElementById('oaButton')) {
                    document.getElementById('oaButton').click();
                }
            });
            
            // 使按钮可聚焦
            document.getElementById('oaButton').setAttribute('tabindex', '0');
        });

        // 窗口大小改变时重新创建粒子（可选，性能考虑）
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                // 在实际应用中，这里可以优化为只调整现有粒子，而不是完全重新创建
            }, 250);
        });
    </script>
</body>
</html>
